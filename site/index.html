<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Attack Academy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html" style="color:#fff;text-decoration:none">Web Attack <span>Academy</span></a>
    <div class="topbar-right">
      <button id="theme-toggle" class="btn gray btn-sm" title="Toggle dark mode" aria-label="Toggle dark mode">🌙 Dark</button>
      <div class="progress" id="global-progress">0 / 0 solved</div>
    </div>
  </div>
  <div class="wrap">
    <div id="mastery" class="mastery" style="display:none"></div>
    <div class="toolbar">
      <input type="search" id="search" class="search" placeholder="Search labs, topics, objectives…" autocomplete="off">
      <select id="f-diff" class="select"><option value="">Any difficulty</option><option value="1">★☆☆☆☆</option><option value="2">★★☆☆☆</option><option value="3">★★★☆☆</option><option value="4">★★★★☆</option><option value="5">★★★★★</option></select>
      <select id="f-status" class="select"><option value="">Any status</option><option value="solved">Solved</option><option value="unsolved">Unsolved</option></select>
      <button id="btn-reset" class="btn gray btn-sm">Reset filters</button>
    </div>
    <div id="grid" class="grid"></div>
    <p class="muted" style="margin-top:16px">Labs run inside a sandboxed Cloudflare Worker so it is safe to practice 24/7 from anywhere. Solve a lab → the server marks it complete for your session.</p>
  </div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
