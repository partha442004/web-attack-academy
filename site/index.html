<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Attack Academy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html" style="text-decoration:none">Web Attack <span>Academy</span></a>
    <div class="topbar-right">
      <span id="auth-area"></span>
      <div id="theme-picker"></div>
      <div class="progress" id="global-progress">0 / 0 solved</div>
    </div>
  </div>
  <div class="wrap">
    <div id="gate" class="gate" style="display:none">
      <div class="gate-card">
        <h1>Web Attack Academy</h1>
        <p>Sign in or create an account to access the practicals.</p>
        <button class="btn primary" id="gate-signin">Sign in</button>
      </div>
    </div>
    <div id="app-content" style="display:none">
    <div id="mastery" class="mastery" style="display:none"></div>
    <div class="toolbar">
      <input type="search" id="search" class="search" placeholder="Search labs, topics, objectives…" autocomplete="off">
      <select id="f-diff" class="select"><option value="">Any difficulty</option><option value="1">★☆☆☆☆</option><option value="2">★★☆☆☆</option><option value="3">★★★☆☆</option><option value="4">★★★★☆</option><option value="5">★★★★★</option></select>
      <select id="f-status" class="select"><option value="">Any status</option><option value="solved">Solved</option><option value="unsolved">Unsolved</option></select>
      <button id="btn-reset" class="btn gray btn-sm">Reset filters</button>
      <span class="toolbar-spacer"></span>
      <button id="btn-export" class="btn gray btn-sm" title="Download your progress as JSON">Export</button>
      <label class="btn gray btn-sm" style="cursor:pointer" title="Restore progress from a JSON file">Import<input type="file" id="btn-import" accept="application/json" style="display:none"></label>
      <button id="btn-reset-progress" class="btn gray btn-sm" title="Reset your saved progress" style="display:none">Reset progress</button>
    </div>
    <div id="grid" class="grid"></div>
    <p class="muted" style="margin-top:16px">Labs run inside a sandboxed Cloudflare Worker so it is safe to practice 24/7 from anywhere. Solve a lab → the server marks it complete for your account.</p>
    </div>
  </div>
  <script src="js/theme.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
